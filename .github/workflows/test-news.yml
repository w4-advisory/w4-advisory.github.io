name: Validate news pipeline
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'news.json'
      - 'news-seen.json'
      - 'assets/news/**'
      - 'news-preview.js'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-news.txt
      - run: python -m pip install -r scripts/requirements-news.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/update_news.py --validate-only
      - run: node --test tests/test_news_preview.js
