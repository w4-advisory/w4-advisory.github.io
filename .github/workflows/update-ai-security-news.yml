name: Update AI security news
on:
  schedule:
    - cron: '0 9 * * *' # Daily, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-security-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select technical AI security research and advisories
        run: python scripts/update_news.py
      - name: Commit updates, if any
        run: bash scripts/publish_news.sh

