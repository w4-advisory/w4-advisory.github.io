name: Update AI security news
on:
  schedule:
    - cron: '0 9 * * *' # Daily, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-security-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select recent AI security headlines
        run: python scripts/update_news.py
      - name: Commit updates, if any
        run: |
          if git diff --quiet -- news.json; then
            echo "No new articles."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "chore: update AI security headlines"
          git push

